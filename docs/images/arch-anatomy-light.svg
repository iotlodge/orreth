<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The anatomy of a running Orreth world: people with a seat, the kernel's six organs and five rails, the crew of ten, the four boxes"><title>The anatomy of a running Orreth world: people with a seat, the kernel's six organs and five rails, the crew of ten, the four boxes</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b665c"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b665c"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a86d12"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#a86d12"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4446b0"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4446b0"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d7f86"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#0d7f86"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6f8c"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#5f6f8c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8362b"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#b8362b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8f5f"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1f8f5f"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1a17"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1c1a17"/></marker></defs><rect width="1200" height="640" rx="14" fill="#f6f1e7"/><text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1c1a17">THE ANATOMY OF A RUNNING WORLD — kernel 0.1.0 on one laptop</text><rect x="40" y="56" width="1120" height="74" rx="12" fill="#fdfbf6" stroke="#a86d12" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#a86d12">PEOPLE — outside the machine, with a seat</text><rect x="150" y="78" width="900" height="40" rx="8" fill="#fbeccb" stroke="#a86d12" stroke-width="1.5"/><text x="600.0" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the owner · masters · persons — a TOTP proof → a signed seat · policy, security, a hand on the interlock</text><line x1="600" y1="118" x2="600" y2="152" stroke="#a86d12" stroke-width="1.5" marker-end="url(#a-human)"/><text x="612" y="140" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#a86d12">the one chat · THE PANEL · every door</text><rect x="40" y="154" width="1120" height="226" rx="12" fill="#fdfbf6" stroke="#4446b0" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#4446b0">orrethd — THE KERNEL · one process · the door on :4600 · the only self that signs as the world's root</text><rect x="60" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="144.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">DESK</text><text x="144.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the seat</text><text x="144.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the join desk</text><rect x="242" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="326.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">GROUND</text><text x="326.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the signed record</text><text x="326.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">one writer, forty tables</text><rect x="424" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="508.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">GATEWAY</text><text x="508.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the meter</text><text x="508.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">every thought, priced</text><rect x="606" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="690.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">SHELF</text><text x="690.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">tools · services</text><text x="690.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">minds, on one ladder</text><rect x="788" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="872.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">MONITOR</text><text x="872.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">watches · levers</text><text x="872.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">checks · the harness</text><rect x="970" y="184" width="168" height="72" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="1054.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">ANALYZER</text><text x="1054.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">intentions by origin</text><text x="1054.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">objectives · thoughts</text><rect x="60" y="272" width="1078" height="90" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="599.0" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">THE FIVE RAILS — the kernel's embedded loops, breathing on the ground</text><text x="599.0" y="309" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">relay · publishes each committed fact from the outbox to both brokers     dispatcher · hands a fact to the one bench it addresses, parks poison with its evidence</text><text x="599.0" y="324" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">scheduler · ticks the standing duties as asks     presence · keeps the bodies' leases     intent · turns every intention — observe · plan · file · hear · re-plan</text><line x1="340" y1="380" x2="340" y2="418" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="340.0" y="393.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">spawn · lease · restart · park</text><rect x="40" y="420" width="605" height="116" rx="12" fill="#fdfbf6" stroke="#0d7f86" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#0d7f86">THE CREW — ten processes the kernel spawns and governs, each its own self</text><rect x="60" y="446" width="260" height="66" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="190.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">RESIDENTS</text><text x="190.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">librarian · echo</text><text x="190.0" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">a name and a persona — they answer you</text><rect x="335" y="446" width="290" height="66" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="480.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">FIRMWARE</text><text x="480.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">planner · critic · grader · mitl</text><text x="480.0" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">toolkeeper · stablekeeper · crew · monitor</text><text x="340" y="526" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10"  fill="#0d7f86">every thought goes through the GATEWAY under the body's own key — nothing thinks off-meter</text><rect x="660" y="420" width="500" height="110" rx="12" fill="#fdfbf6" stroke="#5f6f8c" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="674" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#5f6f8c">THE FOUR BOXES — Docker, one compose</text><rect x="676" y="446" width="108" height="66" rx="8" fill="#e9e3d6" stroke="#5f6f8c" stroke-width="1.5"/><text x="730.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#5f6f8c">Postgres</text><text x="730.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the ground</text><rect x="794" y="446" width="108" height="66" rx="8" fill="#e9e3d6" stroke="#5f6f8c" stroke-width="1.5"/><text x="848.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#5f6f8c">RabbitMQ</text><text x="848.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the invocation rail</text><rect x="912" y="446" width="108" height="66" rx="8" fill="#e9e3d6" stroke="#5f6f8c" stroke-width="1.5"/><text x="966.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#5f6f8c">Kafka</text><text x="966.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the events rail</text><rect x="1030" y="446" width="108" height="66" rx="8" fill="#e9e3d6" stroke="#5f6f8c" stroke-width="1.5"/><text x="1084.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#5f6f8c">LiteLLM</text><text x="1084.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the gateway</text><line x1="730" y1="380" x2="730" y2="418" stroke="#5f6f8c" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="848" y1="380" x2="848" y2="418" stroke="#5f6f8c" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="966" y1="380" x2="966" y2="418" stroke="#5f6f8c" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="1084" y1="380" x2="1084" y2="418" stroke="#5f6f8c" stroke-width="1.5" marker-end="url(#a-box)"/><rect x="40" y="548" width="1120" height="70" rx="12" fill="#fdfbf6" stroke="#6b665c" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#6b665c">A SECOND WORLD IS ONE COMMAND AWAY</text><text x="600" y="590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"  fill="#1c1a17">a cell = its own kernel self · database and role · benches and topics · bodies and keys — sealed; two cells speak only over a signed seam</text><text x="600" y="606" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#6b665c">scripts/dev.sh cell two</text></svg>