erned</text><rect x="770" y="60" width="190" height="60" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="865.0" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">UNDERSTANDING</text><text x="865.0" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">what it means</text><text x="865.0" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a projection, rebuildable</text><rect x="770" y="260" width="190" height="60" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="865.0" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">THE DIGEST</text><text x="865.0" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the short version,</text><text x="865.0" y="312" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">citing its sources</text><line x1="652" y1="170" x2="768" y2="100" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="710.0" y="125.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9b9dff">after commit</text><line x1="652" y1="230" x2="768" y2="280" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="710.0" y="273.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9b9dff">at session boundaries</text><path d="M 770 90 L 145 90 L 145 168" fill="none" stroke="#3fd0cf" stroke-width="1.5" marker-end="url(#a-body)"/><text 