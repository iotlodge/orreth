<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The anatomy of a running Orreth world: people with a seat, the kernel's six organs and five rails, the crew of ten, the four boxes"><title>The anatomy of a running Orreth world: people with a seat, the kernel's six organs and five rails, the crew of ten, the four boxes</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#98a0b4"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#98a0b4"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2a91d"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#f2a91d"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9dff"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#9b9dff"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd0cf"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#3fd0cf"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3c8"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#8fa3c8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b7a"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#ff6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ad39a"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4ad39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6e9f2"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#e6e9f2"/></marker></defs><rect width="1200" height="640" rx="14" fill="#0b0f1a"/><text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e6e9f2">THE ANATOMY OF A RUNNING WORLD — kernel 0.1.0 on one laptop</text><rect x="40" y="56" width="1120" height="74" rx="12" fill="#121a2b" stroke="#f2a91d" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#f2a91d">PEOPLE — outside the machine, with a seat</text><rect x="150" y="78" width="900" height="40" rx="8" fill="#2a2210" stroke="#f2a91d" stroke-width="1.5"/><text x="600.0" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the owner · masters · persons — a TOTP proof → a signed seat · policy, security, a hand on the interlock</text><line x1="600" y1="118" x2="600" y2="152" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><text x="612" y="140" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#f2a91d">the one chat · THE PANEL · every door</text><rect x="40" y="154" width="1120" height="226" rx="12" fill="#121a2b" stroke="#9b9dff" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#9b9dff">orrethd — THE KERNEL · one process · the door on :4600 · the only self that signs as the world's root</text><rect x="60" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="144.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">DESK</text><text x="144.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the seat</text><text x="144.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the join desk</text><rect x="242" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="326.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">GROUND</text><text x="326.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the signed record</text><text x="326.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">one writer, forty tables</text><rect x="424" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="508.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">GATEWAY</text><text x="508.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the meter</text><text x="508.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">every thought, priced</text><rect x="606" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="690.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">SHELF</text><text x="690.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">tools · services</text><text x="690.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">minds, on one ladder</text><rect x="788" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="872.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">MONITOR</text><text x="872.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">watches · levers</text><text x="872.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">checks · the harness</text><rect x="970" y="184" width="168" height="72" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="1054.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">ANALYZER</text><text x="1054.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">intentions by origin</text><text x="1054.0" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">objectives · thoughts</text><rect x="60" y="272" width="1078" height="90" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="599.0" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">THE FIVE RAILS — the kernel's embedded loops, breathing on the ground</text><text x="599.0" y="309" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">relay · publishes each committed fact from the outbox to both brokers     dispatcher · hands a fact to the one bench it addresses, parks poison with its evidence</text><text x="599.0" y="324" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">scheduler · ticks the standing duties as asks     presence · keeps the bodies' leases     intent · turns every intention — observe · plan · file · hear · re-plan</text><line x1="340" y1="380" x2="340" y2="418" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="340.0" y="393.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9b9dff">spawn · lease · restart · park</text><rect x="40" y="420" width="605" height="116" rx="12" fill="#121a2b" stroke="#3fd0cf" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#3fd0cf">THE CREW — ten processes the kernel spawns and governs, each its own self</text><rect x="60" y="446" width="260" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="190.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">RESIDENTS</text><text x="190.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">librarian · echo</text><text x="190.0" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a name and a persona — they answer you</text><rect x="335" y="446" width="290" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="480.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">FIRMWARE</text><text x="480.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">planner · critic · grader · mitl</text><text x="480.0" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">toolkeeper · stablekeeper · crew · monitor</text><text x="340" y="526" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10"  fill="#3fd0cf">every thought goes through the GATEWAY under the body's own key — nothing thinks off-meter</text><rect x="660" y="420" width="500" height="110" rx="12" fill="#121a2b" stroke="#8fa3c8" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="674" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#8fa3c8">THE FOUR BOXES — Docker, one compose</text><rect x="676" y="446" width="108" height="66" rx="8" fill="#1a2438" stroke="#8fa3c8" stroke-width="1.5"/><text x="730.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#8fa3c8">Postgres</text><text x="730.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the ground</text><rect x="794" y="446" width="108" height="66" rx="8" fill="#1a2438" stroke="#8fa3c8" stroke-width="1.5"/><text x="848.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#8fa3c8">RabbitMQ</text><text x="848.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the invocation rail</text><rect x="912" y="446" width="108" height="66" rx="8" fill="#1a2438" stroke="#8fa3c8" stroke-width="1.5"/><text x="966.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#8fa3c8">Kafka</text><text x="966.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the events rail</text><rect x="1030" y="446" width="108" height="66" rx="8" fill="#1a2438" stroke="#8fa3c8" stroke-width="1.5"/><text x="1084.0" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#8fa3c8">LiteLLM</text><text x="1084.0" y="483" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the gateway</text><line x1="730" y1="380" x2="730" y2="418" stroke="#8fa3c8" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="848" y1="380" x2="848" y2="418" stroke="#8fa3c8" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="966" y1="380" x2="966" y2="418" stroke="#8fa3c8" stroke-width="1.5" marker-end="url(#a-box)"/><line x1="1084" y1="380" x2="1084" y2="418" stroke="#8fa3c8" stroke-width="1.5" marker-end="url(#a-box)"/><rect x="40" y="548" width="1120" height="70" rx="12" fill="#121a2b" stroke="#98a0b4" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#98a0b4">A SECOND WORLD IS ONE COMMAND AWAY</text><text x="600" y="590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"  fill="#e6e9f2">a cell = its own kernel self · database and role · benches and topics · bodies and keys — sealed; two cells speak only over a signed seam</text><text x="600" y="606" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#98a0b4">scripts/dev.sh cell two</text></svg>