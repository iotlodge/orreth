<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="The join desk: pending, challenged with the kernel's nonce, proved by signature, admitted at once or staged for a governing seat's yes, then the lease"><title>The join desk: pending, challenged with the kernel's nonce, proved by signature, admitted at once or staged for a governing seat's yes, then the lease</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#98a0b4"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#98a0b4"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2a91d"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#f2a91d"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9dff"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#9b9dff"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd0cf"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#3fd0cf"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3c8"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#8fa3c8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b7a"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#ff6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ad39a"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4ad39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6e9f2"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#e6e9f2"/></marker></defs><rect width="1200" height="330" rx="14" fill="#0b0f1a"/><text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e6e9f2">THE JOIN DESK — joining is a governed request; a keypair is a self</text><rect x="40" y="96" width="190" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="135.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">PENDING</text><text x="135.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">POST /join</text><text x="135.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">did · name · role · public key</text><line x1="230" y1="129" x2="268" y2="129" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="270" y="96" width="190" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="365.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">CHALLENGED</text><text x="365.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the desk's own nonce,</text><text x="365.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">in the same breath</text><line x1="460" y1="129" x2="498" y2="129" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="500" y="96" width="190" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="595.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">PROVED</text><text x="595.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">POST /join/prove</text><text x="595.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a signature over {did, nonce}</text><rect x="730" y="52" width="200" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="830.0" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">DONE — at once</text><text x="830.0" y="89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the crew's spawn ticket ·</text><text x="830.0" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a standing welcome</text><rect x="730" y="142" width="200" height="66" rx="8" fill="#2a2210" stroke="#f2a91d" stroke-width="1.5"/><text x="830.0" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#f2a91d">STAGED — held</text><text x="830.0" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a stranger: join.admit in</text><text x="830.0" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the chat, Cancel the default</text><line x1="690" y1="116" x2="728" y2="90" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><line x1="690" y1="142" x2="728" y2="168" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><line x1="930" y1="166" x2="968" y2="142" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><text x="1070" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#f2a91d">a governing seat's YES</text><line x1="930" y1="86" x2="968" y2="110" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><rect x="970" y="90" width="200" height="78" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="1070.0" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">THE LEASE</text><text x="1070.0" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">POST /join/lease — chained to</text><text x="1070.0" y="142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the root, with the FUEL CLAUSE</text><text x="1070.0" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">(dollars · the renew window)</text><rect x="270" y="206" width="420" height="44" rx="8" fill="#3a1520" stroke="#ff6b7a" stroke-width="1.5"/><text x="480.0" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#ff6b7a">DENIED — one face: “join refused”</text><text x="480.0" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a forged proof · Cancel · fifteen minutes of silence</text><line x1="365" y1="162" x2="365" y2="204" stroke="#ff6b7a" stroke-width="1.5" marker-end="url(#a-red)"/><path d="M 830 208 L 830 228 L 692 228" fill="none" stroke="#ff6b7a" stroke-width="1.5" marker-end="url(#a-red)"/><text x="600" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#98a0b4">the same key is admitted as the same self, life after life · scopes only narrow: the lease opens the body's own words at /delta and nothing more · refusal wears one face</text></svg>