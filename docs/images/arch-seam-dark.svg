<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" width="1100" height="270" role="img" aria-label="How two worlds speak: two sealed cells, one seam signed both ways, an ask that names a cell routes home and parks under partition"><title>How two worlds speak: two sealed cells, one seam signed both ways, an ask that names a cell routes home and parks under partition</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#98a0b4"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#98a0b4"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2a91d"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#f2a91d"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9dff"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#9b9dff"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd0cf"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#3fd0cf"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3c8"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#8fa3c8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b7a"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#ff6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ad39a"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4ad39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6e9f2"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#e6e9f2"/></marker></defs><rect width="1100" height="270" rx="14" fill="#0b0f1a"/><text x="550" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e6e9f2">HOW TWO WORLDS SPEAK — cells are worlds; commands route home</text><rect x="40" y="60" width="440" height="120" rx="12" fill="#121a2b" stroke="#9b9dff" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#9b9dff">CELL ONE — u:one</text><rect x="620" y="60" width="440" height="120" rx="12" fill="#121a2b" stroke="#9b9dff" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="634" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#9b9dff">CELL TWO — u:two</text><rect x="60" y="96" width="150" height="66" rx="8" fill="#2a2210" stroke="#f2a91d" stroke-width="1.5"/><text x="135.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#f2a91d">YOU</text><text x="135.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">“librarian@two,</text><text x="135.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">what is the weather?”</text><rect x="240" y="96" width="220" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="350.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">KERNEL A</text><text x="350.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">its own self · database · role</text><text x="350.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">benches · topics · bodies · keys</text><rect x="640" y="96" width="220" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="750.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">KERNEL B</text><text x="750.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the peer's DID pinned</text><text x="750.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">on first sight</text><rect x="880" y="96" width="160" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="960.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">LIBRARIAN@TWO</text><text x="960.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">answers at home</text><line x1="210" y1="129" x2="238" y2="129" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><line x1="460" y1="118" x2="638" y2="118" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="549.0" y="110.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9b9dff">POST /seam →</text><line x1="638" y1="140" x2="460" y2="140" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="549.0" y="156.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9b9dff">← the reply, landed once</text><line x1="860" y1="129" x2="878" y2="129" stroke="#3fd0cf" stroke-width="1.5" marker-end="url(#a-body)"/><text x="550" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#e6e9f2">every message over the seam is signed by the sending kernel's own self — a nonce · a 120 s window · the epoch — and verified against the pinned DID</text><text x="550" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#e6e9f2">B dark → the ask reads PARKED, “unreachable since …” in plain words · B back → resumed once · the stop rides the seam first and lands within two seconds</text><text x="550" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#98a0b4">a re-homed universe advances its epoch; a stale epoch is fenced · a cell's role reaches no other database</text></svg>