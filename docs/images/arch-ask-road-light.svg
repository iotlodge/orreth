<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The road an ask takes: one transaction writes the ask and its fact, the relay publishes, the dispatcher hands it to one body, the reply lands the same way"><title>The road an ask takes: one transaction writes the ask and its fact, the relay publishes, the dispatcher hands it to one body, the reply lands the same way</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b665c"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b665c"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a86d12"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#a86d12"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4446b0"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4446b0"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d7f86"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#0d7f86"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6f8c"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#5f6f8c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8362b"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#b8362b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8f5f"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1f8f5f"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1a17"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1c1a17"/></marker></defs><rect width="1200" height="470" rx="14" fill="#f6f1e7"/><text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1c1a17">THE ROAD AN ASK TAKES — nothing ever travels off the rails</text><rect x="30" y="56" width="180" height="34" rx="8" fill="#fbeccb" stroke="#a86d12" stroke-width="1.5"/><text x="120.0" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#a86d12">YOU, SEATED</text><path d="M 120 92 L 120 430" fill="none" stroke="#6b665c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-dim)"/><rect x="270" y="56" width="180" height="34" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="360.0" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">THE KERNEL</text><path d="M 360 92 L 360 430" fill="none" stroke="#6b665c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-dim)"/><rect x="510" y="56" width="180" height="34" rx="8" fill="#e9e3d6" stroke="#5f6f8c" stroke-width="1.5"/><text x="600.0" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#5f6f8c">THE GROUND</text><path d="M 600 92 L 600 430" fill="none" stroke="#6b665c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-dim)"/><rect x="750" y="56" width="180" height="34" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="840.0" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">THE RAILS</text><path d="M 840 92 L 840 430" fill="none" stroke="#6b665c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-dim)"/><rect x="990" y="56" width="180" height="34" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="1080.0" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">ECHO, A BODY</text><path d="M 1080 92 L 1080 430" fill="none" stroke="#6b665c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-dim)"/><line x1="126" y1="124" x2="354" y2="124" stroke="#a86d12" stroke-width="1.5" marker-end="url(#a-human)"/><text x="240.0" y="118.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#a86d12">1 · POST /ask {text, session}</text><line x1="366" y1="168" x2="594" y2="168" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="480.0" y="162.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">2 · the ask row + its outbox fact — ONE transaction</text><line x1="354" y1="212" x2="126" y2="212" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="240.0" y="206.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">3 · 201 {ids: [ask_…]} — a journey line under the ask</text><line x1="606" y1="256" x2="834" y2="256" stroke="#5f6f8c" stroke-width="1.5" marker-end="url(#a-box)"/><text x="720.0" y="250.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f6f8c">4 · the relay publishes orreth.ask.received.v1</text><line x1="846" y1="300" x2="1074" y2="300" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="960.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">5 · the dispatcher hands it to echo's bench — exactly one body</text><line x1="1074" y1="344" x2="366" y2="344" stroke="#0d7f86" stroke-width="1.5" marker-end="url(#a-body)"/><text x="720.0" y="338.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0d7f86">6 · the reply, signed by echo's own key</text><line x1="366" y1="388" x2="594" y2="388" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="480.0" y="382.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">7 · reply + outbox fact — ONE transaction</text><line x1="834" y1="432" x2="126" y2="432" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="480.0" y="426.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">8 · the feed lights the panel · the chat shows the reply whole</text><text x="600" y="448" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#6b665c">laws: transactional outbox, always · pointer-only payloads on the rails (the words stay on the ground) · every ask wears its journey · at-least-once, idempotent by the inbox's footprint</text></svg>