erned</text><rect x="770" y="60" width="190" height="60" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="865.0" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">UNDERSTANDING</text><text x="865.0" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">what it means</text><text x="865.0" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">a projection, rebuildable</text><rect x="770" y="260" width="190" height="60" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="865.0" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">THE DIGEST</text><text x="865.0" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the short version,</text><text x="865.0" y="312" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">citing its sources</text><line x1="652" y1="170" x2="768" y2="100" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="710.0" y="125.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">after commit</text><line x1="652" y1="230" x2="768" y2="280" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="710.0" y="273.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">at session boundaries</text><path d="M 770 90 L 145 90 L 145 168" fill="none" stroke="#0d7f86" stroke-width="1.5" marker-end="url(#a-body)"/><text 