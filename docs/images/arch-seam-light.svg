<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" width="1100" height="270" role="img" aria-label="How two worlds speak: two sealed cells, one seam signed both ways, an ask that names a cell routes home and parks under partition"><title>How two worlds speak: two sealed cells, one seam signed both ways, an ask that names a cell routes home and parks under partition</title><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b665c"/></marker><marker id="s-dim" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b665c"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a86d12"/></marker><marker id="s-human" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#a86d12"/></marker><marker id="a-kernel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4446b0"/></marker><marker id="s-kernel" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4446b0"/></marker><marker id="a-body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d7f86"/></marker><marker id="s-body" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#0d7f86"/></marker><marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6f8c"/></marker><marker id="s-box" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#5f6f8c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8362b"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#b8362b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8f5f"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1f8f5f"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1a17"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#1c1a17"/></marker></defs><rect width="1100" height="270" rx="14" fill="#f6f1e7"/><text x="550" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1c1a17">HOW TWO WORLDS SPEAK — cells are worlds; commands route home</text><rect x="40" y="60" width="440" height="120" rx="12" fill="#fdfbf6" stroke="#4446b0" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="54" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#4446b0">CELL ONE — u:one</text><rect x="620" y="60" width="440" height="120" rx="12" fill="#fdfbf6" stroke="#4446b0" stroke-width="1.2" stroke-dasharray="3 4" opacity=".95"/><text x="634" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing=".16em" fill="#4446b0">CELL TWO — u:two</text><rect x="60" y="96" width="150" height="66" rx="8" fill="#fbeccb" stroke="#a86d12" stroke-width="1.5"/><text x="135.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#a86d12">YOU</text><text x="135.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">“librarian@two,</text><text x="135.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">what is the weather?”</text><rect x="240" y="96" width="220" height="66" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="350.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">KERNEL A</text><text x="350.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">its own self · database · role</text><text x="350.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">benches · topics · bodies · keys</text><rect x="640" y="96" width="220" height="66" rx="8" fill="#e4e4fa" stroke="#4446b0" stroke-width="1.5"/><text x="750.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#4446b0">KERNEL B</text><text x="750.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">the peer's DID pinned</text><text x="750.0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">on first sight</text><rect x="880" y="96" width="160" height="66" rx="8" fill="#d7f1f0" stroke="#0d7f86" stroke-width="1.5"/><text x="960.0" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#0d7f86">LIBRARIAN@TWO</text><text x="960.0" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1c1a17">answers at home</text><line x1="210" y1="129" x2="238" y2="129" stroke="#a86d12" stroke-width="1.5" marker-end="url(#a-human)"/><line x1="460" y1="118" x2="638" y2="118" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="549.0" y="110.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">POST /seam →</text><line x1="638" y1="140" x2="460" y2="140" stroke="#4446b0" stroke-width="1.5" marker-end="url(#a-kernel)"/><text x="549.0" y="156.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#4446b0">← the reply, landed once</text><line x1="860" y1="129" x2="878" y2="129" stroke="#0d7f86" stroke-width="1.5" marker-end="url(#a-body)"/><text x="550" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#1c1a17">every message over the seam is signed by the sending kernel's own self — a nonce · a 120 s window · the epoch — and verified against the pinned DID</text><text x="550" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#1c1a17">B dark → the ask reads PARKED, “unreachable since …” in plain words · B back → resumed once · the stop rides the seam first and lands within two seconds</text><text x="550" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#6b665c">a re-homed universe advances its epoch; a stale epoch is fenced · a cell's role reaches no other database</text></svg>