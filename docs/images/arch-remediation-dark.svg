 markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#8fa3c8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b7a"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#ff6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ad39a"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#4ad39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6e9f2"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#e6e9f2"/></marker></defs><rect width="1200" height="380" rx="14" fill="#0b0f1a"/><text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e6e9f2">HOW A RED WATCH IS CURED — the kernel never lowers the ladder because it is running on its own</text><rect x="40" y="80" width="170" height="66" rx="8" fill="#3a1520" stroke="#ff6b7a" stroke-width="1.5"/><text x="125.0" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#ff6b7a">A WATCH TURNS RED</text><text x="125.0" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">orreth.watch.turned.v1</text><text x="125.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the condition holds</text><line x1="210" y1="113" x2="238" y2="113" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="240" y="80" width="180" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="330.0" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">AN OBSERVATION</text><text x="330.0" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">lands under the standing</text><text x="330.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">Resiliency intention</text><line x1="420" y1="113" x2="448" y2="113" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="450" y="80" width="240" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="570.0" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">THE DOSSIER</text><text x="570.0" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">read off the ground — no mind:</text><text x="570.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">the watch · who it names · last acts</text><line x1="690" y1="113" x2="718" y2="113" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="720" y="80" width="240" height="66" rx="8" fill="#0d3438" stroke="#3fd0cf" stroke-width="1.5"/><text x="840.0" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#3fd0cf">THE PLANNER ANSWERS</text><text x="840.0" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">in the lever catalogue, one lever:</text><text x="840.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">LEVER: body.restart echo · BECAUSE …</text><line x1="960" y1="113" x2="988" y2="113" stroke="#98a0b4" stroke-width="1.5" marker-end="url(#a-dim)"/><rect x="990" y="80" width="170" height="66" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="1075.0" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">CONSEQUENCE?</text><text x="1075.0" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">read from the catalogue</text><text x="1075.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">never from the plan</text><rect x="250" y="200" width="260" height="60" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="380.0" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">ROUTINE</text><text x="380.0" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">pulled at once by the kernel's own</text><text x="380.0" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">hands, through the same door you'd use</text><rect x="580" y="200" width="260" height="60" rx="8" fill="#2a2210" stroke="#f2a91d" stroke-width="1.5"/><text x="710.0" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#f2a91d">CONSEQUENTIAL</text><text x="710.0" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">held at the interlock</text><text x="710.0" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">for a person's click</text><rect x="900" y="200" width="260" height="60" rx="8" fill="#3a1520" stroke="#ff6b7a" stroke-width="1.5"/><text x="1030.0" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#ff6b7a">GRAVE</text><text x="1030.0" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">never pulled by the kernel —</text><text x="1030.0" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">a person, with the dossier</text><line x1="1075" y1="146" x2="380" y2="198" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><line x1="1075" y1="146" x2="710" y2="198" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><line x1="1075" y1="146" x2="1030" y2="198" stroke="#ff6b7a" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="270" y="300" width="600" height="52" rx="8" fill="#1b1d4a" stroke="#9b9dff" stroke-width="1.5"/><text x="570.0" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing=".08em" fill="#9b9dff">READ THE WATCH AGAIN after settles_s</text><text x="570.0" y="337" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6e9f2">cured, with its cause · self-healed · still red → once more, then a person with the dossier</text><line x1="380" y1="260" x2="480" y2="298" stroke="#9b9dff" stroke-width="1.5" marker-end="url(#a-kernel)"/><line x1="710" y1="260" x2="640" y2="298" stroke="#f2a91d" stroke-width="1.5" marker-end="url(#a-human)"/><text x="600" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"  fill="#98a0b4">every red is answered and every green attributed · the human can always stop: “stop the kernel's Resiliency intention” is a grave act, recorded, never a deletion</text></svg>