<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Orreth — the forever-improving agent (concept)</title>
  <desc>One agent's thought drawn as a constellation threading the tiers of a living universe:
  small fast nodes among the field moons, a heavier node riding the ecosystem's intel, one
  deliberate node burning at the core where all of time lives — each traversal wider than the
  last, because the substrate under it never stops growing.</desc>

  <defs>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#43589a"/><stop offset="0.55" stop-color="#1a2650"/><stop offset="1" stop-color="#0B1226"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7b731" stop-opacity="0.35"/><stop offset="1" stop-color="#f7b731" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eco" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#8fa8e0"/><stop offset="0.6" stop-color="#33437a"/><stop offset="1" stop-color="#141f42"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.36" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#a9e8c8"/><stop offset="0.6" stop-color="#3d7a5e"/><stop offset="1" stop-color="#16311f"/>
    </radialGradient>
    <linearGradient id="substrate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a" stop-opacity="0"/><stop offset="1" stop-color="#11331f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#0a0e1a"/>

  <!-- faint starfield -->
  <g fill="#243258">
    <circle cx="140" cy="240" r="1.4"/><circle cx="320" cy="150" r="1"/><circle cx="520" cy="90" r="1.3"/>
    <circle cx="880" cy="140" r="1"/><circle cx="1180" cy="110" r="1.4"/><circle cx="1420" cy="230" r="1"/>
    <circle cx="240" cy="520" r="1"/><circle cx="1360" cy="480" r="1.3"/><circle cx="90" cy="760" r="1"/>
    <circle cx="1500" cy="740" r="1.2"/><circle cx="700" cy="60" r="1"/><circle cx="1050" cy="330" r="1"/>
  </g>

  <!-- header -->
  <text x="60" y="76" font-size="38" font-weight="700" letter-spacing="8" fill="#ffffff">THE FOREVER-IMPROVING AGENT</text>
  <text x="60" y="106" font-size="15" fill="#8b93a7">the loop never changes — the world it thinks in compounds</text>
  <text x="1540" y="60" font-size="13" fill="#8b93a7" text-anchor="end">one thought, drawn as a constellation</text>
  <text x="1540" y="82" font-size="13" fill="#a78bfa" text-anchor="end">an org chart for a single thought</text>

  <!-- ══ TIERS, stacked vertically ══ -->

  <!-- apex: the universe core (all of time) -->
  <circle cx="800" cy="240" r="150" fill="url(#coreGlow)"/>
  <circle cx="800" cy="240" r="64" fill="url(#core)" stroke="#334568" stroke-width="1.5"/>
  <text x="800" y="152" font-size="14" letter-spacing="5" fill="#f7b731" text-anchor="middle">U · THE UNIVERSE</text>
  <text x="990" y="236" font-size="12.5" fill="#8b93a7">holds all of time — memory never expires here</text>
  <text x="990" y="256" font-size="12.5" fill="#8b93a7">the heaviest decisions ride this altitude: long</text>
  <text x="990" y="276" font-size="12.5" fill="#8b93a7">observations, human gates, co-signed moves</text>

  <!-- ecosystem tier -->
  <ellipse cx="800" cy="520" rx="560" ry="44" fill="none" stroke="#22304a" stroke-dasharray="3 7"/>
  <circle cx="560" cy="508" r="26" fill="url(#eco)" stroke="#33437a" stroke-width="1.2"/>
  <circle cx="1120" cy="540" r="20" fill="url(#eco)" stroke="#33437a" stroke-width="1" opacity="0.75"/>
  <text x="60" y="514" font-size="14" letter-spacing="5" fill="#9fb6e8">E · THE ECOSYSTEM</text>
  <text x="60" y="536" font-size="12.5" fill="#8b93a7">the distilled intel of every field below —</text>
  <text x="60" y="554" font-size="12.5" fill="#8b93a7">richer this week than last, by construction</text>

  <!-- field tier -->
  <ellipse cx="800" cy="760" rx="660" ry="52" fill="none" stroke="#22304a" stroke-dasharray="3 7"/>
  <circle cx="380" cy="742" r="13" fill="url(#moon)" stroke="#3d7a5e" stroke-width="1"/>
  <circle cx="640" cy="782" r="13" fill="url(#moon)" stroke="#3d7a5e" stroke-width="1"/>
  <circle cx="960" cy="748" r="13" fill="url(#moon)" stroke="#3d7a5e" stroke-width="1"/>
  <circle cx="1240" cy="778" r="11" fill="url(#moon)" stroke="#3d7a5e" stroke-width="1" opacity="0.8"/>
  <!-- tiny workforce ships -->
  <g fill="#eaeffa">
    <circle cx="404" cy="734" r="2.2"/><circle cx="660" cy="770" r="2.2"/><circle cx="985" cy="742" r="2.2"/>
    <circle cx="360" cy="756" r="1.8"/><circle cx="1258" cy="768" r="1.8"/>
  </g>
  <text x="60" y="750" font-size="14" letter-spacing="5" fill="#34d399">F · THE FIELDS</text>
  <text x="60" y="772" font-size="12.5" fill="#8b93a7">where the work happens — fast, cheap,</text>
  <text x="60" y="790" font-size="12.5" fill="#8b93a7">close to the world, short memory</text>

  <!-- ══ THE THOUGHT: three traversals, each wider ══ -->

  <!-- traversal 1: field-only (tight, dim) -->
  <path d="M640,782 C700,712 900,712 960,748 C900,808 700,824 640,782 Z"
        fill="none" stroke="#34d399" stroke-width="1.4" opacity="0.5"/>
  <circle cx="640" cy="782" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="960" cy="748" r="4" fill="#34d399" opacity="0.7"/>
  <text x="820" y="856" font-size="12" fill="#4d7c6f" text-anchor="middle" font-style="italic">traversal 1 — field only: plan · observe · judge</text>

  <!-- traversal 2: rises through the ecosystem (wider, brighter) -->
  <path d="M380,742 C420,620 500,540 560,508 C700,452 980,470 1120,540 C1200,588 1100,700 960,748 C800,800 480,806 380,742 Z"
        fill="none" stroke="#9fb6e8" stroke-width="1.8" opacity="0.75"/>
  <circle cx="560" cy="508" r="5.5" fill="#9fb6e8"/>
  <circle cx="380" cy="742" r="4.5" fill="#9fb6e8" opacity="0.85"/>
  <text x="1258" y="622" font-size="12" fill="#7d90bd" font-style="italic">traversal 2 — + the ecosystem's intel</text>

  <!-- traversal 3: through the core (widest, brass) -->
  <path d="M380,742 C260,560 420,330 736,240 C760,232 840,232 864,240 C1180,330 1340,560 1240,778 C1160,900 560,912 380,742 Z"
        fill="none" stroke="#f7b731" stroke-width="2.4" opacity="0.9"/>
  <circle cx="800" cy="240" r="8" fill="#f7b731"/>
  <circle cx="800" cy="240" r="14" fill="none" stroke="#f7b731" stroke-width="1" opacity="0.5"/>
  <circle cx="1240" cy="778" r="5" fill="#f7b731" opacity="0.9"/>
  <text x="1276" y="356" font-size="12" fill="#c79b45" font-style="italic">traversal 3 — + universal memory,</text>
  <text x="1276" y="374" font-size="12" fill="#c79b45" font-style="italic">a human gate at the top</text>

  <!-- arrowed note: every loop wider -->
  <text x="215" y="430" font-size="13" fill="#eaeffa" font-style="italic">every loop through the world,</text>
  <text x="215" y="450" font-size="13" fill="#f7b731" font-style="italic">wider than the last</text>

  <!-- ══ THE SUBSTRATE, growing beneath everything ══ -->
  <rect x="0" y="880" width="1600" height="120" fill="url(#substrate)"/>
  <g fill="#34d399">
    <g opacity="0.85">
      <circle cx="120" cy="962" r="1.8"/><circle cx="180" cy="948" r="1.8"/><circle cx="240" cy="968" r="1.8"/>
      <circle cx="310" cy="944" r="1.8"/><circle cx="380" cy="964" r="1.8"/><circle cx="450" cy="950" r="1.8"/>
      <circle cx="520" cy="970" r="1.8"/><circle cx="590" cy="946" r="1.8"/><circle cx="660" cy="962" r="1.8"/>
      <circle cx="730" cy="950" r="1.8"/><circle cx="800" cy="968" r="1.8"/><circle cx="870" cy="948" r="1.8"/>
      <circle cx="940" cy="964" r="1.8"/><circle cx="1010" cy="946" r="1.8"/><circle cx="1080" cy="966" r="1.8"/>
      <circle cx="1150" cy="950" r="1.8"/><circle cx="1220" cy="968" r="1.8"/><circle cx="1290" cy="948" r="1.8"/>
      <circle cx="1360" cy="964" r="1.8"/><circle cx="1430" cy="952" r="1.8"/><circle cx="1500" cy="966" r="1.8"/>
    </g>
    <g opacity="0.5">
      <circle cx="150" cy="928" r="1.5"/><circle cx="290" cy="922" r="1.5"/><circle cx="430" cy="930" r="1.5"/>
      <circle cx="570" cy="920" r="1.5"/><circle cx="710" cy="928" r="1.5"/><circle cx="850" cy="922" r="1.5"/>
      <circle cx="990" cy="930" r="1.5"/><circle cx="1130" cy="922" r="1.5"/><circle cx="1270" cy="928" r="1.5"/>
      <circle cx="1410" cy="924" r="1.5"/>
    </g>
    <g opacity="0.25">
      <circle cx="220" cy="904" r="1.3"/><circle cx="460" cy="900" r="1.3"/><circle cx="700" cy="906" r="1.3"/>
      <circle cx="940" cy="900" r="1.3"/><circle cx="1180" cy="906" r="1.3"/><circle cx="1420" cy="902" r="1.3"/>
    </g>
  </g>
  <text x="800" y="935" font-size="12.5" fill="#34d399" text-anchor="middle" opacity="0.9">the substrate never stops growing — context rises · skills cascade · failure is fuel</text>

  <!-- ══ side panel: the mechanism, named ══ -->
  <g>
    <rect x="1305" y="120" width="245" height="150" rx="8" fill="#101826" stroke="#22304a"/>
    <text x="1325" y="150" font-size="12" font-weight="700" letter-spacing="2" fill="#eaeffa">WHY IT NEVER STOPS</text>
    <text x="1325" y="176" font-size="11.5" fill="#8b93a7">the loop is fixed — behavior is data</text>
    <text x="1325" y="196" font-size="11.5" fill="#8b93a7">placement is policy: higher = longer</text>
    <text x="1325" y="212" font-size="11.5" fill="#8b93a7">memory, heavier gates</text>
    <text x="1325" y="234" font-size="11.5" fill="#8b93a7">doubt buys altitude, on the meter</text>
    <text x="1325" y="256" font-size="11.5" fill="#f7b731">every cycle: a signed, scored record</text>
  </g>

  <!-- footer -->
  <text x="60" y="968" font-size="12" fill="#4b5678">orreth.ai</text>
  <text x="1540" y="968" font-size="12" fill="#4b5678" text-anchor="end">the same graph, aging into competence</text>
</svg>
