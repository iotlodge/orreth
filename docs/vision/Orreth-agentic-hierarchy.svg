<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Orreth — an entirely agentic universe</title>
  <desc>An agent-staffed hierarchy: a Universe of Ecosystems of Fields of Agents. Resident agents (including becky, the IAM agent) run every layer; memory and context rise pruned; skills and policy cascade down; humans appear only at governed HITL gates on the right.</desc>

  <defs>
    <linearGradient id="uniGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b731"/><stop offset="1" stop-color="#e8940f"/>
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5050d8"/><stop offset="1" stop-color="#3c3cae"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a0a0"/><stop offset="1" stop-color="#0b6e6e"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7b731" stop-opacity="0.5"/><stop offset="1" stop-color="#f7b731" stop-opacity="0"/>
    </radialGradient>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#0a0e1a"/>

  <!-- header -->
  <text x="60" y="78" font-size="42" font-weight="700" letter-spacing="10" fill="#ffffff">ORRETH</text>
  <text x="60" y="108" font-size="15" fill="#8b93a7">an entirely agentic universe — hierarchies of agents governing agents · humans only at the gates</text>
  <text x="60" y="130" font-size="13" fill="#5b6274">a universe has many ecosystems · an ecosystem has many fields · a field has many agents — the same node, all the way down</text>
  <text x="1540" y="60" font-size="13" fill="#8b93a7" text-anchor="end">context rises — pruned · skills cascade — versioned</text>
  <text x="1540" y="82" font-size="13" fill="#8b93a7" text-anchor="end">every layer is staffed by resident agents</text>

  <!-- legend -->
  <g font-size="12">
    <path d="M160,142 L172,142" stroke="#34d399" stroke-width="2.5" marker-end="url(#up)"/>
    <text x="182" y="146" fill="#34d399">memory &amp; context UP</text>
    <path d="M400,142 L412,142" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#down)"/>
    <text x="422" y="146" fill="#fbbf24">skills &amp; policy DOWN</text>
    <path d="M640,136 L647,143 L640,150 L633,143 Z" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="658" y="146" fill="#a78bfa">human gate (HITL)</text>
    <circle cx="852" cy="142" r="5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="866" y="146" fill="#d9a94e">becky — the IAM agent (resident, never a human)</text>
  </g>

  <!-- side flows -->
  <path d="M100,830 L100,205" stroke="#34d399" stroke-width="3" marker-end="url(#up)" opacity="0.9"/>
  <text x="82" y="515" font-size="13" fill="#34d399" letter-spacing="2" text-anchor="middle" transform="rotate(-90 82 515)">MEMORY &amp; CONTEXT RISE — PRUNED AT EVERY LAYER</text>
  <path d="M1120,205 L1120,830" stroke="#fbbf24" stroke-width="3" marker-end="url(#down)" opacity="0.9"/>
  <text x="1142" y="515" font-size="13" fill="#fbbf24" letter-spacing="2" text-anchor="middle" transform="rotate(90 1142 515)">SKILLS &amp; POLICY CASCADE — FLOORS NEVER LOOSEN</text>

  <!-- UNIVERSE -->
  <ellipse cx="610" cy="244" rx="390" ry="110" fill="url(#glowGrad)" opacity="0.35"/>
  <rect x="310" y="180" width="600" height="128" rx="14" fill="url(#uniGrad)"/>
  <text x="610" y="214" font-size="24" font-weight="700" fill="#3b2300" text-anchor="middle" letter-spacing="3">UNIVERSE</text>
  <text x="610" y="236" font-size="11.5" fill="#5a3a00" text-anchor="middle">foundation &amp; apex · all-time memory · universal floors · the spacetime window</text>
  <g font-size="11" fill="#3b2300" text-anchor="middle">
    <rect x="374" y="252" width="116" height="22" rx="11" fill="rgba(0,0,0,0.28)" stroke="#8a5a00" stroke-width="1.2"/>
    <text x="432" y="267" fill="#ffe9c2" font-weight="600">becky · IAM agent</text>
    <rect x="502" y="252" width="100" height="22" rx="11" fill="rgba(0,0,0,0.18)"/>
    <text x="552" y="267">memory steward</text>
    <rect x="614" y="252" width="102" height="22" rx="11" fill="rgba(0,0,0,0.18)"/>
    <text x="665" y="267">analysis agents</text>
    <rect x="728" y="252" width="118" height="22" rx="11" fill="rgba(0,0,0,0.18)"/>
    <text x="787" y="267">governance agents</text>
  </g>
  <text x="610" y="330" font-size="12.5" font-style="italic" fill="#d9a94e" text-anchor="middle">resident agents run this layer — no human lives in this box</text>
  <text x="610" y="356" font-size="11.5" font-style="italic" fill="#8b93a7" text-anchor="middle">every layer governs down — and is governed from above</text>

  <!-- Universe <-> Ecosystem connectors -->
  <path d="M282,388 L362,314" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M346,314 L266,388" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>
  <path d="M938,388 L858,314" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M874,314 L954,388" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>

  <!-- ECOSYSTEMS -->
  <g>
    <rect x="180" y="388" width="380" height="122" rx="12" fill="url(#ecoGrad)"/>
    <text x="370" y="416" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">ECOSYSTEM</text>
    <text x="370" y="434" font-size="10.5" fill="#c7c9f2" text-anchor="middle">EH — the governance loop, proven · mid-horizon memory</text>
    <g font-size="10" fill="#e4e6ff" text-anchor="middle">
      <rect x="227" y="448" width="106" height="20" rx="10" fill="rgba(0,0,0,0.28)"/>
      <text x="280" y="462">governance agents</text>
      <rect x="343" y="448" width="56" height="20" rx="10" fill="rgba(0,0,0,0.28)"/>
      <text x="371" y="462">steward</text>
      <rect x="409" y="448" width="104" height="20" rx="10" fill="rgba(0,0,0,0.28)" stroke="#b8860b" stroke-width="1"/>
      <text x="461" y="462" fill="#ffe9c2">becky (delegated)</text>
    </g>
    <text x="370" y="494" font-size="10.5" fill="#b9bce8" text-anchor="middle">prunes &amp; distills upward · governs its fields · adds policy, never loosens floors</text>
  </g>
  <g>
    <rect x="660" y="388" width="380" height="122" rx="12" fill="url(#ecoGrad)"/>
    <text x="850" y="416" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">ECOSYSTEM</text>
    <text x="850" y="434" font-size="10.5" fill="#c7c9f2" text-anchor="middle">same node, its own tenancy · a line of business, a team, a world</text>
    <g font-size="10" fill="#e4e6ff" text-anchor="middle">
      <rect x="707" y="448" width="106" height="20" rx="10" fill="rgba(0,0,0,0.28)"/>
      <text x="760" y="462">governance agents</text>
      <rect x="823" y="448" width="56" height="20" rx="10" fill="rgba(0,0,0,0.28)"/>
      <text x="851" y="462">steward</text>
      <rect x="889" y="448" width="104" height="20" rx="10" fill="rgba(0,0,0,0.28)" stroke="#b8860b" stroke-width="1"/>
      <text x="941" y="462" fill="#ffe9c2">becky (delegated)</text>
    </g>
    <text x="850" y="494" font-size="10.5" fill="#b9bce8" text-anchor="middle">tenant-isolated from its siblings — on write and on read</text>
  </g>
  <text x="610" y="455" font-size="22" fill="#5b6274" text-anchor="middle">⋯</text>

  <!-- Ecosystem <-> Field connectors -->
  <path d="M242,570 L322,516" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M338,516 L258,570" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>
  <path d="M462,570 L402,516" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M418,516 L478,570" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>
  <path d="M742,570 L802,516" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M818,516 L758,570" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>
  <path d="M962,570 L882,516" stroke="#34d399" stroke-width="2" marker-end="url(#up)"/>
  <path d="M898,516 L978,570" stroke="#fbbf24" stroke-width="2" marker-end="url(#down)"/>

  <!-- FIELDS -->
  <g text-anchor="middle">
    <g>
      <rect x="150" y="570" width="200" height="158" rx="10" fill="url(#fieldGrad)"/>
      <text x="250" y="596" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">FIELD</text>
      <text x="250" y="612" font-size="9.5" fill="#bfeaea">leaf harness — agents live here</text>
      <rect x="187" y="624" width="66" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="220" y="637" font-size="9.5" fill="#dff5f5">commander</text>
      <rect x="261" y="624" width="52" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="287" y="637" font-size="9.5" fill="#dff5f5">steward</text>
      <g fill="#cbd5e1">
        <circle cx="187" cy="664" r="4"/><circle cx="208" cy="664" r="4"/><circle cx="229" cy="664" r="4"/><circle cx="250" cy="664" r="4"/><circle cx="271" cy="664" r="4"/><circle cx="292" cy="664" r="4"/><circle cx="313" cy="664" r="4"/>
        <circle cx="187" cy="682" r="4"/><circle cx="208" cy="682" r="4"/><circle cx="229" cy="682" r="4"/><circle cx="250" cy="682" r="4"/><circle cx="271" cy="682" r="4"/><circle cx="292" cy="682" r="4"/><circle cx="313" cy="682" r="4"/>
      </g>
      <text x="250" y="708" font-size="9.5" fill="#bfeaea">workforce — living identities</text>
    </g>
    <g>
      <rect x="370" y="570" width="200" height="158" rx="10" fill="url(#fieldGrad)"/>
      <text x="470" y="596" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">FIELD</text>
      <text x="470" y="612" font-size="9.5" fill="#bfeaea">leaf harness — agents live here</text>
      <rect x="407" y="624" width="66" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="440" y="637" font-size="9.5" fill="#dff5f5">commander</text>
      <rect x="481" y="624" width="52" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="507" y="637" font-size="9.5" fill="#dff5f5">steward</text>
      <g fill="#cbd5e1">
        <circle cx="407" cy="664" r="4"/><circle cx="428" cy="664" r="4"/><circle cx="449" cy="664" r="4"/><circle cx="470" cy="664" r="4"/><circle cx="491" cy="664" r="4"/><circle cx="512" cy="664" r="4"/><circle cx="533" cy="664" r="4"/>
        <circle cx="407" cy="682" r="4"/><circle cx="428" cy="682" r="4"/><circle cx="449" cy="682" r="4"/><circle cx="470" cy="682" r="4"/><circle cx="491" cy="682" r="4"/><circle cx="512" cy="682" r="4"/><circle cx="533" cy="682" r="4"/>
      </g>
      <text x="470" y="708" font-size="9.5" fill="#bfeaea">doing anything one might imagine</text>
    </g>
    <g>
      <rect x="650" y="570" width="200" height="158" rx="10" fill="url(#fieldGrad)"/>
      <text x="750" y="596" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">FIELD</text>
      <text x="750" y="612" font-size="9.5" fill="#bfeaea">leaf harness — agents live here</text>
      <rect x="687" y="624" width="66" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="720" y="637" font-size="9.5" fill="#dff5f5">commander</text>
      <rect x="761" y="624" width="52" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="787" y="637" font-size="9.5" fill="#dff5f5">steward</text>
      <g fill="#cbd5e1">
        <circle cx="687" cy="664" r="4"/><circle cx="708" cy="664" r="4"/><circle cx="729" cy="664" r="4"/><circle cx="750" cy="664" r="4"/><circle cx="771" cy="664" r="4"/><circle cx="792" cy="664" r="4"/><circle cx="813" cy="664" r="4"/>
        <circle cx="687" cy="682" r="4"/><circle cx="708" cy="682" r="4"/><circle cx="729" cy="682" r="4"/><circle cx="750" cy="682" r="4"/><circle cx="771" cy="682" r="4"/><circle cx="792" cy="682" r="4"/><circle cx="813" cy="682" r="4"/>
      </g>
      <text x="750" y="708" font-size="9.5" fill="#bfeaea">workforce — living identities</text>
    </g>
    <g>
      <rect x="870" y="570" width="200" height="158" rx="10" fill="url(#fieldGrad)"/>
      <text x="970" y="596" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">FIELD</text>
      <text x="970" y="612" font-size="9.5" fill="#bfeaea">leaf harness — agents live here</text>
      <rect x="907" y="624" width="66" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="940" y="637" font-size="9.5" fill="#dff5f5">commander</text>
      <rect x="981" y="624" width="52" height="18" rx="9" fill="rgba(0,0,0,0.28)"/>
      <text x="1007" y="637" font-size="9.5" fill="#dff5f5">steward</text>
      <g fill="#cbd5e1">
        <circle cx="907" cy="664" r="4"/><circle cx="928" cy="664" r="4"/><circle cx="949" cy="664" r="4"/><circle cx="970" cy="664" r="4"/><circle cx="991" cy="664" r="4"/><circle cx="1012" cy="664" r="4"/><circle cx="1033" cy="664" r="4"/>
        <circle cx="907" cy="682" r="4"/><circle cx="928" cy="682" r="4"/><circle cx="949" cy="682" r="4"/><circle cx="970" cy="682" r="4"/><circle cx="991" cy="682" r="4"/><circle cx="1012" cy="682" r="4"/><circle cx="1033" cy="682" r="4"/>
      </g>
      <text x="970" y="708" font-size="9.5" fill="#bfeaea">workforce — living identities</text>
    </g>
  </g>
  <text x="610" y="655" font-size="22" fill="#5b6274" text-anchor="middle">⋯</text>

  <!-- workforce strip -->
  <rect x="150" y="756" width="920" height="60" rx="10" fill="#11172a" stroke="#2a3350"/>
  <text x="610" y="780" font-size="13" font-weight="600" fill="#e6e9f2" text-anchor="middle">THE WORKFORCE — LangGraph · AgentField · any SDK — DIDs issued by becky → NANDA</text>
  <text x="610" y="800" font-size="11" fill="#8b93a7" text-anchor="middle">models reached only through each layer's Model Gateway — LiteLLM / OpenRouter routing · model-tier pinning · budgets</text>

  <!-- gates + leaders -->
  <g stroke="#a78bfa" fill="#1a1430">
    <path d="M938,233 L949,244 L938,255 L927,244 Z" stroke-width="1.6"/>
    <path d="M1052,438 L1063,449 L1052,460 L1041,449 Z" stroke-width="1.6"/>
    <path d="M1082,638 L1093,649 L1082,660 L1071,649 Z" stroke-width="1.6"/>
  </g>
  <g font-size="9" fill="#a78bfa" text-anchor="middle">
    <text x="938" y="270">gate</text>
    <text x="1052" y="475">gate</text>
    <text x="1082" y="675">gate</text>
  </g>
  <g stroke="#7c5bb8" stroke-dasharray="4 4" opacity="0.6">
    <path d="M951,244 L1178,244" fill="none"/>
    <path d="M1065,449 L1178,449" fill="none"/>
    <path d="M1095,649 L1178,560" fill="none"/>
  </g>

  <!-- THE HELM -->
  <rect x="1180" y="180" width="370" height="400" rx="14" fill="#131a30" stroke="#4c3a75" stroke-width="1.5"/>
  <circle cx="1218" cy="212" r="9" fill="#c4b5fd"/>
  <path d="M1204,238 a14,12 0 0 1 28,0" fill="#c4b5fd"/>
  <text x="1244" y="212" font-size="16" font-weight="700" fill="#e6e9f2">THE HELM</text>
  <text x="1244" y="232" font-size="11.5" fill="#a78bfa">humans — only when needed</text>
  <path d="M1200,254 L1530,254" stroke="#2a3350"/>
  <g font-size="12" fill="#cdd3e8">
    <text x="1204" y="282">▸ approve escalations at the gates (HITL)</text>
    <text x="1204" y="306">▸ co-sign apex actions — never one god</text>
    <text x="1204" y="330">▸ set objectives &amp; non-overridable floors</text>
    <text x="1204" y="354">▸ entitled panes — see own layer, down</text>
  </g>
  <path d="M1200,376 L1530,376" stroke="#2a3350"/>
  <g font-size="11.5" font-style="italic" fill="#8b93a7">
    <text x="1204" y="400">humans are governed principals — every</text>
    <text x="1204" y="418">touch is scoped, directional, signed, and</text>
    <text x="1204" y="436">logged. The watchers are watched.</text>
  </g>
  <g font-size="11.5" fill="#a78bfa">
    <text x="1204" y="466">the hierarchy runs itself — agentically.</text>
    <text x="1204" y="484">conductors conduct; they don't operate.</text>
  </g>
  <g font-size="10.5" fill="#5b6274">
    <text x="1204" y="520">identity chain: becky → DID → NANDA,</text>
    <text x="1204" y="536">root to leaf — agents and humans alike</text>
  </g>

  <!-- footer -->
  <rect x="60" y="920" width="1490" height="48" rx="10" fill="#11172a" stroke="#2a3350"/>
  <text x="84" y="950" font-size="14" fill="#e6e9f2">an agentic universe end to end — agents staff every layer · agents govern agents · context rises, skills cascade · humans at the gates, not in the loop</text>
  <text x="1526" y="950" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="end">Security first. Trust, but verify.</text>
</svg>
