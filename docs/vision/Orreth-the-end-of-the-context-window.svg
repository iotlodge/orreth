<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#070A16"/>
    </linearGradient>
    <!-- memory ages leftward: blueshifted distillation → bright near NOW -->
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB6E8" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#16203C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1C2A4A" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="uniLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB6E8" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#22304F" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2A3A60" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2440"/><stop offset="1" stop-color="#0D1428"/>
    </linearGradient>
    <linearGradient id="windowG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A960" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#D4A960" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D4A960" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M5,0.5 L9.5,9 L0.5,9 z" fill="#7FD1A8"/></marker>
    <marker id="ret" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="#D4A960"/></marker>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="none"/><line x1="0" y1="0" x2="0" y2="9" stroke="#D4A960" stroke-opacity="0.16" stroke-width="2.4"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- faint stars -->
  <g fill="#2c3a5e"><circle cx="180" cy="120" r="1.2"/><circle cx="1490" cy="90" r="1.2"/><circle cx="1230" cy="60" r="1"/>
    <circle cx="700" cy="70" r="1"/><circle cx="1560" cy="620" r="1"/><circle cx="90" cy="640" r="1"/></g>

  <!-- ===================== title ===================== -->
  <text x="64" y="58" font-size="15" letter-spacing="7" fill="#D4A960" font-weight="600">O R R E T H</text>
  <text x="64" y="104" font-size="40" font-weight="800" fill="#E8EDF7" letter-spacing="0.5">THE END OF THE CONTEXT WINDOW</text>
  <text x="64" y="132" font-size="15.5" fill="#8B98B8">an enterprise's memory across spacetime — every actor an identity &#183; every memory signed &#183; nothing unattributable</text>

  <!-- ===================== time axis ===================== -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <line x1="270" y1="176" x2="1536" y2="176" stroke="#263352" stroke-width="1"/>
    <text x="270" y="166" fill="#9FB6E8">&#9668; deep past &#183; distilled, never lost</text>
    <text x="1536" y="166" fill="#D4A960" text-anchor="end" font-weight="700">NOW &#9658;</text>
    <!-- horizon ticks = the retention dials -->
    <g stroke="#263352" stroke-dasharray="3 5">
      <line x1="620" y1="176" x2="620" y2="756"/><line x1="1010" y1="176" x2="1010" y2="756"/><line x1="1330" y1="176" x2="1330" y2="756"/>
    </g>
    <text x="620" y="750" fill="#5A6584" text-anchor="middle">-1y &#183; ecosystem horizon</text>
    <text x="1330" y="750" fill="#5A6584" text-anchor="middle">-90d &#183; field horizon</text>
  </g>

  <!-- ===================== tree gutter ===================== -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <line x1="84" y1="216" x2="84" y2="742" stroke="#263352"/>
    <text x="64" y="243" fill="#D4A960" font-weight="700">u:acme</text>
    <line x1="84" y1="262" x2="104" y2="262" stroke="#263352"/>
    <text x="106" y="296" fill="#9FB6E8">e:cloud</text>
    <text x="126" y="330" fill="#8B98B8" font-size="12">f:prod</text>
    <text x="126" y="418" fill="#8B98B8" font-size="12">f:lab</text>
    <text x="106" y="496" fill="#9FB6E8">e:league</text>
    <text x="126" y="530" fill="#8B98B8" font-size="12">f:team-a</text>
    <text x="126" y="618" fill="#8B98B8" font-size="12">f:team-b</text>
    <text x="106" y="700" fill="#5A6584">e:&#8230;</text>
    <text x="126" y="722" fill="#5A6584" font-size="11.5">as many worlds as the org needs</text>
  </g>

  <!-- ===================== retrieval arc (drawn first: lanes and text overlay it) ===================== -->
  <path d="M 1472,614 C 1300,600 1150,540 1035,490 C 900,432 700,330 560,275 C 520,260 490,250 468,244"
        fill="none" stroke="#D4A960" stroke-width="2.2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#ret)"/>

  <!-- ===================== lanes ===================== -->
  <!-- universe lane -->
  <rect x="270" y="222" width="1266" height="34" rx="4" fill="url(#uniLane)" stroke="#3A4A72"/>
  <text x="1524" y="216" font-size="12" fill="#9FB6E8" text-anchor="end" font-family="ui-monospace, Menlo, monospace">all-time memory &#183; distilled &#8594; forever &#183; the apex holds what mattered</text>
  <!-- universe distilled dots: sparse, blueshifted, deep past -->
  <g fill="#9FB6E8" filter="url(#glow)">
    <circle cx="360" cy="239" r="4"/><circle cx="470" cy="239" r="4"/><circle cx="585" cy="239" r="4"/>
    <circle cx="760" cy="239" r="4"/><circle cx="930" cy="239" r="4"/><circle cx="1120" cy="239" r="4"/><circle cx="1300" cy="239" r="4"/>
  </g>

  <!-- ecosystem + field lanes helper comment: eco bands hold distill dots; fields hold agent threads -->
  <!-- e:cloud band -->
  <rect x="270" y="272" width="1266" height="36" rx="4" fill="url(#lane)" stroke="#2A3757"/>
  <g fill="#9FB6E8"><circle cx="700" cy="290" r="3"/><circle cx="850" cy="290" r="3"/><circle cx="1060" cy="290" r="3"/><circle cx="1240" cy="290" r="3"/><circle cx="1420" cy="290" r="3"/></g>
  <!-- f:prod agent threads -->
  <g stroke-width="1.4">
    <line x1="270" y1="330" x2="1536" y2="330" stroke="#31405F"/>
    <line x1="270" y1="352" x2="1536" y2="352" stroke="#31405F"/>
    <line x1="270" y1="374" x2="1536" y2="374" stroke="#31405F"/>
  </g>
  <!-- f:lab threads -->
  <g stroke-width="1.4">
    <line x1="270" y1="414" x2="1536" y2="414" stroke="#31405F"/>
    <line x1="270" y1="436" x2="1536" y2="436" stroke="#31405F"/>
  </g>
  <!-- e:league band -->
  <rect x="270" y="472" width="1266" height="36" rx="4" fill="url(#lane)" stroke="#2A3757"/>
  <g fill="#9FB6E8"><circle cx="640" cy="490" r="3"/><circle cx="900" cy="490" r="3"/><circle cx="1150" cy="490" r="3"/><circle cx="1390" cy="490" r="3"/></g>
  <!-- f:team-a threads -->
  <g stroke-width="1.4">
    <line x1="270" y1="526" x2="1536" y2="526" stroke="#31405F"/>
    <line x1="270" y1="548" x2="1536" y2="548" stroke="#31405F"/>
    <line x1="270" y1="570" x2="1536" y2="570" stroke="#31405F"/>
  </g>
  <!-- f:team-b threads -->
  <g stroke-width="1.4">
    <line x1="270" y1="614" x2="1536" y2="614" stroke="#31405F"/>
    <line x1="270" y1="636" x2="1536" y2="636" stroke="#31405F"/>
  </g>
  <!-- faded future ecosystems -->
  <rect x="270" y="676" width="1266" height="60" rx="4" fill="#121B32" opacity="0.5" stroke="#1E2A47" stroke-dasharray="4 6"/>

  <!-- ===================== memory stars on threads (dense near NOW, sparse left) ===================== -->
  <g fill="#7FD1A8">
    <!-- f:prod -->
    <circle cx="1345" cy="330" r="2.6"/><circle cx="1385" cy="330" r="2.6"/><circle cx="1420" cy="330" r="2.6"/><circle cx="1455" cy="330" r="2.6"/><circle cx="1490" cy="330" r="2.6"/><circle cx="1520" cy="330" r="2.6"/>
    <circle cx="1160" cy="330" r="2.4"/><circle cx="1240" cy="330" r="2.4"/><circle cx="1060" cy="330" r="2.4"/>
    <circle cx="1360" cy="352" r="2.6"/><circle cx="1405" cy="352" r="2.6"/><circle cx="1445" cy="352" r="2.6"/><circle cx="1485" cy="352" r="2.6"/><circle cx="1515" cy="352" r="2.6"/>
    <circle cx="1200" cy="352" r="2.4"/><circle cx="1100" cy="352" r="2.4"/>
    <circle cx="1375" cy="374" r="2.6"/><circle cx="1430" cy="374" r="2.6"/><circle cx="1478" cy="374" r="2.6"/><circle cx="1512" cy="374" r="2.6"/>
    <circle cx="1275" cy="374" r="2.4"/>
    <!-- f:lab -->
    <circle cx="1350" cy="414" r="2.6"/><circle cx="1400" cy="414" r="2.6"/><circle cx="1452" cy="414" r="2.6"/><circle cx="1500" cy="414" r="2.6"/>
    <circle cx="1385" cy="436" r="2.6"/><circle cx="1440" cy="436" r="2.6"/><circle cx="1495" cy="436" r="2.6"/><circle cx="1525" cy="436" r="2.6"/>
    <!-- f:team-a -->
    <circle cx="1340" cy="526" r="2.6"/><circle cx="1390" cy="526" r="2.6"/><circle cx="1435" cy="526" r="2.6"/><circle cx="1480" cy="526" r="2.6"/><circle cx="1518" cy="526" r="2.6"/>
    <circle cx="1150" cy="526" r="2.4"/><circle cx="1230" cy="526" r="2.4"/>
    <circle cx="1365" cy="548" r="2.6"/><circle cx="1415" cy="548" r="2.6"/><circle cx="1462" cy="548" r="2.6"/><circle cx="1505" cy="548" r="2.6"/>
    <circle cx="1370" cy="570" r="2.6"/><circle cx="1425" cy="570" r="2.6"/><circle cx="1472" cy="570" r="2.6"/><circle cx="1515" cy="570" r="2.6"/>
    <circle cx="1090" cy="570" r="2.4"/>
    <!-- f:team-b -->
    <circle cx="1355" cy="614" r="2.6"/><circle cx="1410" cy="614" r="2.6"/><circle cx="1465" cy="614" r="2.6"/><circle cx="1510" cy="614" r="2.6"/>
    <circle cx="1395" cy="636" r="2.6"/><circle cx="1450" cy="636" r="2.6"/><circle cx="1502" cy="636" r="2.6"/>
  </g>
  <!-- older, blueshifting field memories (between eco and field horizons) -->
  <g fill="#9FB6E8" opacity="0.75">
    <circle cx="680" cy="352" r="2.2"/><circle cx="790" cy="330" r="2.2"/><circle cx="880" cy="374" r="2.2"/><circle cx="950" cy="330" r="2.2"/>
    <circle cx="720" cy="526" r="2.2"/><circle cx="840" cy="548" r="2.2"/><circle cx="965" cy="570" r="2.2"/><circle cx="905" cy="614" r="2.2"/>
    <circle cx="760" cy="436" r="2.2"/><circle cx="700" cy="614" r="2.2"/>
  </g>

  <!-- ===================== the metabolism: memory rises at the horizons ===================== -->
  <g stroke="#7FD1A8" stroke-width="1.8" opacity="0.85">
    <line x1="1318" y1="326" x2="1318" y2="300" marker-end="url(#up)"/>
    <line x1="1318" y1="566" x2="1318" y2="500" marker-end="url(#up)"/>
    <line x1="606" y1="286" x2="606" y2="262" marker-end="url(#up)"/>
    <line x1="606" y1="486" x2="606" y2="262" marker-end="url(#up)" opacity="0.5"/>
  </g>
  <g font-size="11.5" fill="#7FD1A8" font-family="ui-monospace, Menlo, monospace">
    <text x="1310" y="322" text-anchor="end">&#8593; prune &#183; distill</text>
    <text x="592" y="282" text-anchor="end">&#8593; promote &#183; the apex keeps what mattered</text>
  </g>

  <!-- ===================== the Window: a cross-section at T ===================== -->
  <g>
    <rect x="1062" y="210" width="46" height="546" fill="url(#windowG)" stroke="#D4A960" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="1085" y="775" font-size="12.5" fill="#D4A960" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">the Window &#183; T = any moment</text>
    <text x="1085" y="792" font-size="11" fill="#8B98B8" text-anchor="middle">a governed cross-section &#183; Sourced + Verified</text>
  </g>

  <!-- ===================== retrieval: one question climbs the tiers ===================== -->
  <circle cx="1472" cy="614" r="5" fill="#D4A960" filter="url(#glow)"/>
  <text x="1464" y="601" font-size="11.5" fill="#D4A960" font-family="ui-monospace, Menlo, monospace" text-anchor="end">one question &#8594;</text>
  <g font-size="10.5" fill="#8B98B8" font-family="ui-monospace, Menlo, monospace">
    <text x="1306" y="519" text-anchor="end">&#8599; field served its 90d &#183; escalated</text>
    <text x="712" y="343">&#8599; eco served its year &#183; escalated</text>
    <text x="468" y="212" text-anchor="middle" fill="#D4A960">the universe answers from all of time</text>
  </g>

  <!-- ===================== the context window, to scale ===================== -->
  <g>
    <rect x="1476" y="628" width="34" height="16" fill="none" stroke="#E89A8F" stroke-width="1.6"/>
    <line x1="1476" y1="652" x2="1290" y2="700" stroke="#E89A8F" stroke-width="1" opacity="0.7"/>
    <text x="1284" y="712" font-size="13.5" fill="#E89A8F" text-anchor="end" font-weight="700">a context window, drawn to scale</text>
    <text x="1284" y="729" font-size="11.5" fill="#B98680" text-anchor="end">everything to its left: forgotten by design</text>
  </g>

  <!-- ===================== the floors: bedrock ===================== -->
  <rect x="64" y="806" width="1472" height="64" rx="8" fill="url(#floorG)" stroke="#3A4A72" stroke-width="1.5"/>
  <rect x="64" y="806" width="1472" height="64" rx="8" fill="url(#hatch)"/>
  <text x="88" y="833" font-size="16" font-weight="800" fill="#D4A960" letter-spacing="2">THE FLOORS</text>
  <text x="88" y="854" font-size="12.5" fill="#8B98B8">policy bedrock &#183; cascades into every world &#183; a child may tighten, never loosen &#183; the whole block stands on it</text>
  <!-- a drawn key: the pinned trust root -->
  <g transform="translate(1178,822)" stroke="#E8EDF7" stroke-width="1.8" fill="none">
    <circle cx="0" cy="0" r="5"/><line x1="5" y1="0" x2="18" y2="0"/><line x1="13" y1="0" x2="13" y2="5"/><line x1="18" y1="0" x2="18" y2="6"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="end">
    <text x="1512" y="827" fill="#E8EDF7">pinned trust root &#183; only it mints authority</text>
    <text x="1512" y="848" fill="#7FD1A8">&#10003; every memory Ed25519-signed by its author</text>
    <text x="1512" y="864" fill="#8B98B8" font-size="11">vigil watches &#183; content-blind, shape-aware</text>
  </g>

  <!-- ===================== footer ===================== -->
  <text x="800" y="922" font-size="15" fill="#8B98B8" text-anchor="middle">The context window is a porthole. <tspan fill="#E8EDF7" font-weight="700">This is the ocean</tspan> — identity-anchored, floor-founded, navigable to any moment, <tspan fill="#7FD1A8">Sourced + Verified</tspan> across all of time.</text>
  <text x="800" y="948" font-size="12" fill="#5A6584" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">orreth &#183; the memory substrate for living identities</text>
</svg>
