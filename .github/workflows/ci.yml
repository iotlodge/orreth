# The conformance suite as a gate: every push proves both implementations still agree.
name: conformance
on:
  push:
    branches: [main, "rearch/**"]
  pull_request:

jobs:
  reference:
    name: python reference (38 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install + test
        working-directory: backend/conformance
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

  spine:
    name: spine laws — envelope + M1 durability boundary (rearch line)
    runs-on: ubuntu-latest
    services:
      ground:
        image: postgres:16
        env:
          POSTGRES_USER: orreth
          POSTGRES_PASSWORD: orreth-dev
          POSTGRES_DB: spine
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U orreth -d spine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      events:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      SPINE_PG: postgresql://orreth:orreth-dev@localhost:5433/spine
      SPINE_REQUIRE_PG: "1"
      SPINE_KAFKA: localhost:9092
      SPINE_REQUIRE_KAFKA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install + test
        working-directory: spine
        run: |
          uv sync
          uv run pytest -q

  plane:
    name: rust plane (conformance fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/plane
      - name: cargo test
        working-directory: backend/plane
        run: cargo test
