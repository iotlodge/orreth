[project]
name = "orreth-conformance"
version = "0.0.1"
description = "Orreth reference simulator + conformance suite — validates the contracts and the three flows before the Rust plane exists"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "referencing>=0.33",
    "cryptography>=42.0",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orreth_sim"]
