# re-base sp2 (2026-09-29): ONE member. The first plane's crates (orreth-crypto · node · store · resolver ·
# rollup) and the old `orrethd` were each read against the new kernel and, on JB's word, retired to the tag
# `main-v0.72-old-world` (the branch `old-world/main-v0.72`); the kernel's binary `orrethd` is orreth-spine's.
[workspace]
resolver = "2"
members = [
    "crates/orreth-spine",
]

# NOTE: serde_json stays on default features — its Map is a BTreeMap (sorted keys),
# which the canonicalization parity with the Python reference depends on.
# Never enable "preserve_order" in this workspace.
[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
# P7 sp1 (orreth-spine): TOTP per RFC 6238 and the word-shaped laws the fixtures assert.
hmac = "0.12"
sha1 = "0.10"
regex = "1"
# P7 sp2 (orreth-spine, feature `rails`): the ground and the rails from Rust —
# tokio-postgres for the ground (async; the sync `postgres` orrethd wears is the
# same protocol crate underneath), lapin for the invoke rail (AMQP), rdkafka for
# the events rail (librdkafka built by cmake from the vendored source, so no
# system library is needed — CI's rust job compiles it hermetically IF the
# feature is ever turned on there; by default it is off and nothing here builds).
tokio = "1"
tokio-postgres = "0.7"
lapin = "4"
rdkafka = { version = "0.39", features = ["cmake-build"] }
rand = "0.8"
# P7 sp3 (orreth-spine, feature `bridge`): the Rust bridge, now `orrethd` on :4600 — axum, tokio-stream for the SSE feed, qrcode + flate2 for the
# enrollment QR (the matrix drawn, the PNG written by hand as the Python does).
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
# P7 sp6 (orreth-spine, feature `bridge`): the bodies' seam — ureq (the blocking HTTP
# client orrethd already wears) for the gateway's management doors, the canary and the
# MCP servers over HTTP, run on tokio's blocking pool; libc for the SIGINT a governed
# body is stopped with (stopped WHOLE, never killed first).
ureq = { version = "2", features = ["json"] }
libc = "0.2"
