# PROVENANCE: Claude Fable 5.1 (claude-fable-5-1) — rearch P7 sp1, the bytes · 2026-09-22
# Amended: Claude Fable 5.1 (claude-fable-5-1) — rearch P7 sp2, the ground and the rails · 2026-09-22
# Amended: Claude Fable 5.1 (claude-fable-5-1) — rearch P7 sp3, the ask road · 2026-09-22
# Amended: Claude Fable 5.1 (claude-fable-5-1) — rearch P7 sp4, the loops · 2026-09-23
[package]
name = "orreth-spine"
version = "0.1.0"
edition = "2021"
description = "The Orreth kernel's pure laws, ported from the Python spine against the conformance suite (canon 0008)"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
regex = { workspace = true }
ed25519-dalek = { workspace = true }

# The rails (P7 sp2) ride behind ONE feature so `cargo test` stays hermetic by
# default — no ground, no broker, no librdkafka build — and the rail tests run
# only when asked for by name with the rig up:
#   cargo test -p orreth-spine --features rails --test rails -- --nocapture
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "time", "net", "process", "sync"] }
tokio-postgres = { workspace = true, optional = true }
lapin = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# The bridge (P7 sp3) rides behind `bridge` (which implies `rails`): the doors,
# the SSE feed and the `spine-bridge` binary on :4601 — the Rust bridge in
# SHADOW beside the Python Bridge on :4600. `tests/askroad.rs` needs it:
#   cargo test -p orreth-spine --features bridge --test rails --test askroad -- --nocapture
axum = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
rails = ["dep:tokio", "dep:tokio-postgres", "dep:lapin", "dep:rdkafka", "dep:rand"]
bridge = ["rails", "dep:axum", "dep:tokio-stream", "dep:qrcode", "dep:flate2", "dep:base64", "tokio/signal"]

[[test]]
name = "rails"
required-features = ["rails"]

[[test]]
name = "askroad"
required-features = ["bridge"]

# The loops' shadow proof (P7 sp4): both kernels beating on one ground, one beat at a time.
[[test]]
name = "loops"
required-features = ["bridge"]

[[test]]
name = "memory"
required-features = ["bridge"]

[[bin]]
name = "spine-bridge"
path = "src/bin/spine-bridge.rs"
required-features = ["bridge"]
