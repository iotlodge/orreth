<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orreth · the Window</title>
<style>
  :root{--void:#070B18;--deep:#0B1226;--hair:#243352;--star:#E8EDF7;--dim:#8B98B8;
    --faint:#4A5578;--brass:#D4A960;--near:#7FD1A8;--blue:#9FB6E8;--red:#E89A8F;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--serif:Palatino,Georgia,serif}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--void);color:var(--star);font:14px/1.5 system-ui,sans-serif}

  /* ══ the block — the whole viewport IS the universe ══ */
  #block{position:fixed;inset:0;cursor:crosshair}
  .band{position:absolute;left:0;right:0;border-top:1px solid var(--hair)}
  .band-label{position:absolute;left:1.2rem;top:.6rem;font-family:var(--serif);
    font-variant-caps:small-caps;letter-spacing:.35em;font-size:.78rem;color:var(--faint);
    pointer-events:none}
  .band.apex{background:linear-gradient(90deg,rgba(159,182,232,.10),rgba(159,182,232,.02) 60%)}
  .band.mid{background:linear-gradient(90deg,rgba(159,182,232,.05),transparent 55%)}
  #nowline{position:absolute;top:0;bottom:0;right:3.5rem;width:1px;
    background:linear-gradient(var(--brass),transparent 85%);opacity:.6}
  #nowline::after{content:"NOW";position:absolute;top:50%;right:-2.6rem;
    font:700 .7rem var(--mono);color:var(--brass);letter-spacing:.15em}

  .star{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;
    transition:transform .18s ease}
  .star:hover{transform:translate(-50%,-50%) scale(2.2)}
  .star.near{background:var(--near);box-shadow:0 0 10px 2px rgba(127,209,168,.55)}
  .star.blue{background:var(--blue);box-shadow:0 0 10px 2px rgba(159,182,232,.55)}
  .star.red{background:var(--red);box-shadow:0 0 10px 2px rgba(232,154,143,.55)}
  @keyframes arrive{from{opacity:0;transform:translate(-50%,-50%) scale(3)}to{opacity:1}}
  .star{animation:arrive .5s ease both}
  @media (prefers-reduced-motion:reduce){.star{animation:none}}

  /* ambient dust */
  .dust{position:absolute;width:1px;height:1px;border-radius:50%;background:#2A3A60;
    pointer-events:none}

  /* ══ floating HUD — corners, zero chrome ══ */
  .hud{position:fixed;font-family:var(--mono);z-index:5}
  #hud-mark{top:1.1rem;left:1.3rem;font-family:var(--serif);font-variant-caps:small-caps;
    letter-spacing:.4em;font-size:1rem;color:var(--brass)}
  #hud-mark b{color:var(--star);font-weight:400}
  #hud-station{top:2.9rem;left:1.35rem;font-size:.72rem;color:var(--dim)}
  #hud-health{top:1.2rem;right:1.4rem;font-size:.74rem;color:var(--dim);text-align:right}
  #hud-health b{color:var(--star)}
  .live::before{content:"●";color:var(--near);margin-right:.4em;animation:breathe 3s infinite}
  @keyframes breathe{50%{opacity:.3}}
  #hud-chain{bottom:1.2rem;right:1.4rem;font-size:.72rem;display:flex;gap:.4rem;align-items:center}
  .bead{border:1px solid var(--hair);border-radius:999px;padding:.15em .8em;color:var(--faint)}
  .bead.lit{color:var(--star);border-color:var(--brass)}
  #hud-scrub{bottom:1.1rem;left:1.3rem;width:min(42vw,460px)}
  #hud-scrub .lbl{font-size:.72rem;color:var(--dim);margin-bottom:.3rem}
  #hud-scrub .lbl b{color:var(--brass);font-size:.9rem}
  input[type=range]{width:100%;appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:24px;margin-top:-11px;
    background:var(--brass);border-radius:2px;cursor:ew-resize;
    box-shadow:0 0 0 1px var(--void),0 0 12px rgba(212,169,96,.6)}
  #remnote{position:fixed;bottom:4.2rem;left:1.35rem;font:italic .72rem var(--mono);
    color:var(--red);opacity:.85;z-index:5}

  /* ══ the glass — detail slides over the void ══ */
  #glass{position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);z-index:9;
    background:linear-gradient(105deg,rgba(13,20,40,.92),rgba(9,14,30,.97));
    border-left:1px solid var(--brass);backdrop-filter:blur(6px);
    transform:translateX(102%);transition:transform .28s ease;padding:2rem 1.8rem;
    font-family:var(--mono);font-size:.8rem;overflow-y:auto}
  #glass.open{transform:none}
  #glass .t{color:var(--star);font-size:.95rem;margin-bottom:1rem}
  #glass .k{color:var(--faint)} #glass .row{margin:.55rem 0;overflow-wrap:anywhere}
  #glass pre{color:var(--blue);white-space:pre-wrap;border-top:1px solid var(--hair);
    margin-top:1rem;padding-top:1rem}
  #glass .chip{font-size:.68rem;border:1px solid;border-radius:999px;padding:.1em .7em}
  #glass .close{position:absolute;top:1rem;right:1.2rem;color:var(--faint);cursor:pointer;
    font-size:1.1rem}
  .quiet{color:var(--faint)}
</style>
</head>
<body>
<div id="block"></div>
<div id="nowline"></div>

<div class="hud" id="hud-mark">orreth · <b>the window</b></div>
<div class="hud" id="hud-station">station —</div>
<div class="hud" id="hud-health"><span class="quiet">reaching the daemon…</span></div>
<div class="hud" id="hud-chain"></div>
<div class="hud" id="hud-scrub">
  <div class="lbl">window&nbsp;<b id="days">—</b>&nbsp;days into the past · <span id="count">—</span></div>
  <input type="range" id="scrub" min="1" max="100" value="62" aria-label="window depth">
</div>
<div id="remnote" hidden></div>

<aside id="glass"><span class="close" onclick="glass.classList.remove('open')">✕</span>
  <div id="glass-body"><span class="quiet">select a memory…</span></div></aside>

<script>
"use strict";
/* the pane is a client of the retrieval contract — no privileged path (0008).
   v2: immersive — the viewport IS the block; tiers are bands of sky; memories are stars. */
const cfg=(()=>{try{return JSON.parse(atob(location.hash.slice(3)))}catch{return null}})();
const $=id=>document.getElementById(id);
const glass=$("glass");
const DAY=864e5, iso=d=>d.toISOString().replace(/\.\d+Z$/,"Z");
const scrubToDays=v=>Math.round(Math.exp(Math.log(730)*v/100));
const fclass=f=>f==="verified"?"near":f==="distilled"?"blue":"red";
const tierOf=s=>Math.min((s.match(/\//g)||[]).length,2);   // 0 apex · 1 eco · 2 field

const block=$("block");
function bands(){
  const tiers=cfg?.tiers?[...cfg.tiers].reverse():["u:demo","u:demo/e:cloud","u:demo/e:cloud/f:prod"];
  const h=window.innerHeight, top=0.14*h, usable=h-top-90;
  block.innerHTML="";
  tiers.forEach((t,i)=>{
    const b=document.createElement("div");
    b.className="band "+(i===0?"apex":i===tiers.length-1?"":"mid");
    b.style.top=(top+usable*i/tiers.length)+"px"; b.style.height=(usable/tiers.length)+"px";
    b.innerHTML=`<span class="band-label">${t}</span>`;
    block.appendChild(b);
  });
  for(let i=0;i<70;i++){const d=document.createElement("div");d.className="dust";
    d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";
    d.style.opacity=.3+Math.random()*.5;block.appendChild(d)}
  return {top,usable,n:tiers.length};
}

async function health(){
  try{const h=await (await fetch("/health")).json();
    $("hud-station").textContent=`station ${h.scope}`;
    $("hud-health").innerHTML=`<span class="live">live</span> records <b>${h.records}</b>`+
      `<br>high-water <b>${h.high_water??"—"}</b>`;
  }catch{$("hud-health").innerHTML=`<span style="color:var(--red)">daemon dark</span>`}
}

let seq=0;
async function scrub(){
  const days=scrubToDays(+$("scrub").value); $("days").textContent=days;
  if(!cfg)return;
  const from=new Date(Date.now()-days*DAY), mine=++seq;
  const res=await fetch("/retrieve",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({query:{requester:cfg.requester,subject:"self",space:"self",
      time:{from:iso(from)},intent:"recall",budget:{cost:4},auth:"biscuit-sim"},
      token:cfg.token,requester_scope:cfg.requester_scope})});
  if(mine!==seq)return;
  if(!res.ok){$("count").textContent="capability refused — the window stays dark";return}
  const r=await res.json();
  render(r,from,days);
}

function render(r,from,days){
  const geo=bands();
  const span=Date.now()-from.getTime();
  const W=window.innerWidth-56, tiers=cfg?.tiers?[...cfg.tiers].reverse():[];
  for(const h of r.hits){
    const s=document.createElement("div");
    const age=(new Date(h.occurred_at)-from.getTime())/span;
    const ti=tiers.length?Math.max(0,tiers.indexOf(h.scope)):tierOf(h.scope);
    const band=(ti<0?geo.n-1:ti);
    s.className="star "+fclass(h.fidelity);
    const sz=5+3*age;                        /* nearer light is larger */
    s.style.width=s.style.height=sz+"px";
    s.style.left=Math.max(8,Math.min(W,W*age))+"px";
    s.style.top=(geo.top+geo.usable*(band+.25+Math.random()*.5)/geo.n)+"px";
    s.title=`${h.occurred_at} · ${h.fidelity}`;
    s.onclick=()=>open_glass(h);
    block.appendChild(s);
  }
  $("count").textContent=`${r.hits.length} memor${r.hits.length===1?"y":"ies"} · ${r.verification}`;
  const rem=$("remnote");
  if(r.remainder){rem.hidden=false;
    rem.textContent=`before ${r.remainder.not_served.from.slice(0,10)}: un-served — this lease does not reach deeper`}
  else rem.hidden=true;
  const served=r.provenance.served_by;
  $("hud-chain").innerHTML=(cfg?.tiers??[]).map(t=>
    `<span class="bead${served.includes(t)?" lit":""}">${t.split("/").pop()}</span>`).join("");
}

async function open_glass(h){
  const cls=fclass(h.fidelity);
  $("glass-body").innerHTML=`<div class="t">${h.occurred_at}</div>
    <div class="row"><span class="chip ${cls}" style="color:var(--${cls==='near'?'near':cls==='blue'?'blue':'red'});border-color:currentColor">${h.fidelity}</span></div>
    <div class="row"><span class="k">ref&nbsp;&nbsp;&nbsp;&nbsp;</span>${h.ref}</div>
    <div class="row"><span class="k">author&nbsp;</span>${h.source}</div>
    <div class="row"><span class="k">scope&nbsp;&nbsp;</span>${h.scope}</div>
    <pre>fetching body — verified against its own address…</pre>`;
  glass.classList.add("open");
  const res=await fetch(`/records/${encodeURIComponent(h.ref)}/body`);
  glass.querySelector("pre").textContent=res.ok?
    JSON.stringify(await res.json(),null,2):
    "body not held at this tier (a deeper tier answered this hit)";
}

$("scrub").addEventListener("input",scrub);
window.addEventListener("resize",scrub);
setInterval(health,5000); setInterval(scrub,20000);   /* the view is ALIVE — it re-observes */
health().then(scrub);
</script>
</body>
</html>
