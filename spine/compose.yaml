# PROVENANCE: Claude Fable 5 (claude-fable-5) — rearch P0 sp1, the rig breathes · 2026-09-16
# The new line's dev rig: the ground (Postgres), the invocation rail
# (RabbitMQ), the events rail (Kafka, KRaft single node). Host ports are
# chosen to never collide with the old world's rig (4500-4502) or a local
# Postgres (5432): the ground answers on 5433.
name: orreth-spine

services:
  ground:
    image: postgres:16
    container_name: orreth-spine-ground
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: orreth
      POSTGRES_PASSWORD: orreth-dev
      POSTGRES_DB: spine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orreth -d spine"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  invoke:
    image: rabbitmq:3.13-management
    container_name: orreth-spine-invoke
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: orreth
      RABBITMQ_DEFAULT_PASS: orreth-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  events:
    image: apache/kafka:3.9.1
    container_name: orreth-spine-events
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
