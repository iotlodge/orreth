# PROVENANCE: Claude Fable 5 (claude-fable-5) — rearch P0 sp1, the rig breathes · 2026-09-16
# The new line's dev rig: the ground (Postgres), the invocation rail
# (RabbitMQ), the events rail (Kafka, KRaft single node). Host ports are
# chosen to never collide with the old world's rig (4500-4502) or a local
# Postgres (5432): the ground answers on 5433.
# P6.5 sp1 (JB's lock, 2026-09-22): the ground's data lives on a NAMED volume,
# `orreth-spine-ground`, so a recreated container keeps the world — it ran on
# an anonymous volume before (migrated once by hand: stop · create · cp -a · up).
# Amended: Claude Fable 5.1 (claude-fable-5-1) — rearch P6.5 sp3, the Stable keeper: the gateway joins the rig · 2026-09-24
name: orreth-spine

services:
  ground:
    image: postgres:16
    container_name: orreth-spine-ground
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: orreth
      POSTGRES_PASSWORD: orreth-dev
      POSTGRES_DB: spine
    volumes:
      - orreth-spine-ground:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orreth -d spine"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  invoke:
    image: rabbitmq:3.13-management
    container_name: orreth-spine-invoke
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: orreth
      RABBITMQ_DEFAULT_PASS: orreth-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  events:
    image: apache/kafka:3.9.1
    container_name: orreth-spine-events
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # P6.5 sp3 (JB's lock, 2026-09-24): THE GATEWAY — LiteLLM, run and managed by
  # Orreth. Every mind, wherever it resides (Anthropic · OpenRouter · Ollama on the
  # host · any OpenAI-compatible base), is a model entry the Stable writes here;
  # every body thinks through it with its OWN virtual key wearing its budget and
  # renewal window (the fuel clause); every answer wears its cost. Provider keys
  # reach the container from the shell's environment only — a key VALUE lives in
  # no record, no file of Orreth's (0059's env-secrets law); a stall names the
  # env NAME. The gateway keeps its own ledger in a `litellm` database on the
  # ground (dev.sh `up` creates it once). Host port 4604 (the bridges hold
  # 4600/4601; the old world 4500-4502).
  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: orreth-spine-gateway
    ports: ["4604:4000"]
    environment:
      DATABASE_URL: postgresql://orreth:orreth-dev@ground:5432/litellm
      LITELLM_MASTER_KEY: ${SPINE_GATEWAY_KEY:-sk-orreth-dev}
      LITELLM_SALT_KEY: ${SPINE_GATEWAY_SALT:-sk-orreth-dev-salt}
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOG: ${SPINE_GATEWAY_LOG:-ERROR}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]   # Ollama on the host, by name
    depends_on:
      ground:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

volumes:
  orreth-spine-ground:
    name: orreth-spine-ground
